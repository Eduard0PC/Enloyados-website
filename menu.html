<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&family=Rampart+One&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Asimovian&family=Bitcount+Prop+Single:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>MENU - ENLOYADOS</title>
</head>

<body>
  <header class="lados">
    <div class="logo">
      <a href="index.html">
        <img src="img/logo.png" alt="logo">
        <h1>ENLOYADOS</h1>
      </a>
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="nav" id="navMenu">
      <a href="index.html">HOME</a>
      <a href="menu.html">MENU</a>
      <a href="about.html">QUIENES SOMOS</a>
      <a href="contact.html">CONTACTANOS</a>
      <a href="login.html" id="nav-login-btn">INICIAR SESIÓN</a>
    </div>
  </header>

  <main class="menu">
    <h1>DESCUBRE LOS PLATILLOS QUE TENEMOS PARA TI</h1>

    <div class="dish-cont" id="menu-container">
      <!-- Menu cards dynamically loaded from JavaScript simulated database -->
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 ENLOYADOS — Todos los derechos reservados.</p>
  </footer>

  <script src="js/db.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderPublicMenu();
    });

    function renderPublicMenu() {
      const container = document.getElementById("menu-container");
      if (!container) return;

      const menu = getMenu();
      if (menu.length === 0) {
        container.parentElement.innerHTML = `
          <h1>DESCUBRE LOS PLATILLOS QUE TENEMOS PARA TI</h1>
          <p class="no-registros" style="text-align:center; font-size: 18px; margin-top: 20px;">No hay registros en el menú.</p>
        `;
        return;
      }

      container.innerHTML = menu.map(function (item) {
        var imageSrc = getImageUrl(item.path);
        return `
          <div class="dish-card">
            <img class="dish-img" src="${imageSrc}" alt="${item.nombre}">
            <h4>${item.nombre}</h4>
            <p>${item.desc}</p>
            <p class="price">$${item.price}</p>
          </div>
        `;
      }).join("");
    }
  </script>
</body>

</html>
